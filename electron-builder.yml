appId: com.j8rlchik.smartstore-price-bot
# yaml-language-server: $schema=node_modules/app-builder-lib/scheme.json
productName: smartstore-price-bot

directories:
  # 아이콘 등 빌드용 리소스를 찾는 폴더
  buildResources: resources
  # dist는 build:cli(tsc)의 출력 폴더라 겹치지 않게 따로 둔다.
  output: release

# electron-vite 빌드 결과만 넣는다. dependencies의 node_modules는 electron-builder가 따로 넣는다.
files:
  - out/**
  - package.json

win:
  target: nsis
  icon: resources/icon.png

nsis:
  # 기본값인 사용자별 원클릭 설치를 쓴다. %LOCALAPPDATA%\Programs에 관리자 권한 없이 설치된다.
  artifactName: ${productName}-${version}-setup.${ext}

# 이 단계에서는 로컬에서 설치 파일만 만든다. GitHub Release 업로드는 릴리스 워크플로에서 정한다.
publish: null
