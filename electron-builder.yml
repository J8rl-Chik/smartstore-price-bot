appId: com.j8rlchik.smartstore-price-bot
# yaml-language-server: $schema=node_modules/app-builder-lib/scheme.json
productName: smartstore-price-bot

directories:
  # 아이콘 등 빌드용 리소스를 찾는 폴더
  buildResources: resources
  # dist는 build:cli(tsc)의 출력 폴더라 겹치지 않게 따로 둔다.
  output: release

# electron-vite 빌드 결과만 넣는다. dependencies의 node_modules는 electron-builder가 따로 넣는다.
files:
  - out/**
  - package.json

win:
  target: nsis
  icon: resources/icon.png

nsis:
  # 기본값인 사용자별 원클릭 설치를 쓴다. %LOCALAPPDATA%\Programs에 관리자 권한 없이 설치된다.
  artifactName: ${productName}-${version}-setup.${ext}
  # 앱을 지우면 네이버 로그인 쿠키(chrome-profile)와 저장한 설정이 든 %APPDATA%\smartstore-price-bot도 함께 지운다.
  # 자동 업데이트로 기존 버전을 제거할 때는 지우지 않는다. (원클릭 설치에서만 동작)
  deleteAppDataOnUninstall: true

# 배포한 실행 파일을 다른 프로그램이 Node처럼 실행하거나 디버거를 붙여, 이 앱의 권한으로 비밀값을 복호화하지 못하게 막는다.
electronFuses:
  # ELECTRON_RUN_AS_NODE로 실행 파일을 Node로 실행하지 못하게 한다. main은 process.fork를 쓰지 않는다.
  runAsNode: false
  # NODE_OPTIONS로 시작 시 임의 코드를 불러오지 못하게 한다.
  enableNodeOptionsEnvironmentVariable: false
  # --inspect 인자로 디버거를 붙이지 못하게 한다.
  enableNodeCliInspectArguments: false
  # app.asar가 빌드 때 계산한 해시와 다르면 실행하지 않는다. Windows는 Electron 30부터 지원한다.
  enableEmbeddedAsarIntegrityValidation: true
  # 검사하지 않은 app 폴더 대신 app.asar에서만 앱 코드를 불러온다.
  onlyLoadAppFromAsar: true
  # renderer를 file:// 대신 app://renderer/로 띄우므로, file:// 페이지에 주던 추가 권한(다른 로컬 파일 fetch 등)을 끈다.
  grantFileProtocolExtraPrivileges: false

# 릴리스 워크플로가 --publish always로 GitHub Release에 올린다. 로컬 빌드(dist)는 CI가 아니라 올리지 않는다.
# releaseType을 생략하면 draft로 올라간다. 설치 테스트 후 직접 공개해야 자동 업데이트 대상이 된다.
publish:
  provider: github
  # 생략하면 .git/config에서 추측한 저장소가 앱의 app-update.yml에 들어가므로 직접 적는다.
  owner: J8rl-Chik
  repo: smartstore-price-bot
