name: Release

on:
  push:
    tags:
      - 'v*'

# electron-builder가 Release를 만들고 파일을 올리므로 contents 쓰기 권한이 필요하다.
permissions:
  contents: write

jobs:
  release:
    # NSIS 설치 파일은 Windows에서 빌드한다.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 앱은 PC에 설치된 Chrome을 쓰므로 puppeteer가 Chrome을 내려받지 않게 한다.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      # 태그와 앱 버전이 다르면 v1.0.1 Release에 1.0.0 앱이 올라가므로 빌드 전에 막는다.
      - name: 태그와 package.json version 비교
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json version($version)이 다릅니다."
            exit 1
          fi

      - run: npm ci

      - run: npm run build:electron

      # electron-builder는 파일을 동시에 올리면서 Release가 없으면 파일마다 draft를 따로 만든다.
      # 미리 draft를 만들어 두면 electron-builder가 그 draft를 찾아 모든 파일을 한곳에 올린다.
      # draft는 같은 태그로 여러 개 만들어지므로, 재실행할 때 중복되지 않게 이미 있으면 건너뛴다.
      - name: draft Release 생성
        shell: bash
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [ -n "$existing" ]; then
            echo "$GITHUB_REF_NAME Release가 이미 있어 생성을 건너뜁니다."
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 위에서 만든 draft에 설치 파일, blockmap, latest.yml을 올린다.
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
