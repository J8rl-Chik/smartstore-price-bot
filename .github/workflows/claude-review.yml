name: Claude Review

on:
  pull_request:

permissions:
  # Claude가 저장소 파일(CLAUDE.md, .claude/skills 등)을 읽는다.
  contents: read
  # 리뷰 댓글과 줄 단위 댓글을 단다.
  pull-requests: write

# 리뷰 도중 새 커밋이 push되면 이전 리뷰를 취소하고 최신 커밋만 리뷰해 비용을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Dependabot PR에서는 일반 secrets를 쓸 수 없어 토큰이 비므로 건너뛴다.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Claude가 diff 바깥의 관련 코드와 컨벤션 파일까지 읽을 수 있게 PR 브랜치를 받는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # Pro 구독으로 실행한다. API 크레딧이 들지 않는다.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App을 설치하지 않고 워크플로의 토큰으로 댓글을 단다.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            이 PR을 리뷰한다. PR 브랜치는 현재 작업 디렉터리에 이미 checkout돼 있다.

            기준
            - CLAUDE.md의 협업 방식·코딩 컨벤션과 .claude/skills의 컨벤션
            - 버그, 잘못된 동작, 빠진 예외 처리
            - 보안 문제 (secrets 노출, 워크플로 권한 과다 등)
            - 소스를 바꿨는데 테스트 파일이 함께 바뀌지 않은 경우
            - 더 이상 쓰이지 않게 된 코드·mock이 남은 경우

            작성 규칙
            - 모든 댓글은 한국어로 쓴다.
            - 특정 코드의 문제는 mcp__github_inline_comment__create_inline_comment(confirmed: true)로 해당 줄에 단다.
            - 전체 요약은 gh pr comment로 한 번만 단다. 문제가 없으면 없다고만 쓴다.
            - 요약 댓글에서 파일을 가리킬 때는 상대 경로를 쓰지 않는다. GitHub 댓글에서는 상대 경로가 PR 페이지 기준으로 풀려 링크가 깨진다.
              https://github.com/<REPO>/blob/<HEAD SHA>/<경로>#L<줄> 형식의 절대 URL로 링크한다.
            - 근거가 확실하지 않은 추측성 지적은 하지 않는다.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
