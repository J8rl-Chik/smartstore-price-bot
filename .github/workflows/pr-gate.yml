name: PR Gate

on:
  pull_request:
  # PR이 저장한 캐시는 그 PR에서만 쓸 수 있다. base 브랜치에 push될 때도 실행해 캐시를 저장해야
  # 새 PR의 첫 실행에서도 node_modules 캐시를 복원할 수 있다.
  push:
    branches: [feat/implement-electron-gui, main]

# 이 워크플로는 코드를 읽기만 하므로 GITHUB_TOKEN 권한을 최소로 둔다.
permissions:
  contents: read

# 그룹 이름이 같은 실행은 동시에 돌지 않고, 새 실행이 시작되면 이전 실행을 취소한다.
# PR에서 github.ref는 refs/pull/번호/merge라서 같은 PR끼리만 묶이고 다른 PR은 취소되지 않는다.
# push에서는 refs/heads/브랜치라서 같은 브랜치의 push끼리 묶인다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 이 job 이름이 Ruleset의 필수 상태 검사 목록에 나타난다. 바꾸면 Ruleset도 같이 바꿔야 한다.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 테스트는 puppeteer로 Chrome을 띄우지 않으므로 설치 때 Chrome을 내려받지 않는다.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 이후 단계(npm ci의 install script 등)가 토큰을 읽지 못하게 git 인증 정보를 남기지 않는다.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # lock 파일이 같으면 node_modules를 그대로 복원해 npm ci를 건너뛴다.
      # 다른 lock 파일의 node_modules가 섞이지 않게 restore-keys는 쓰지 않는다.
      # 네이티브 파일(.node)은 모두 OS·CPU별로 미리 빌드된 것이라 Node 버전은 키에 넣지 않는다.
      # node-gyp로 빌드하는 패키지(binding.gyp)가 추가되면 Node 버전을 키에 다시 넣는다.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm run lint

      - run: npm run lint:style

      - run: npm run typecheck

      # .test.tsx는 실제 브라우저에서 돌기 때문에 Chromium이 필요하다.
      # 러너 이미지에 실행 라이브러리가 이미 있어 --with-deps는 폰트 패키지만 apt로 설치하는데,
      # 이 apt 설치가 가끔 수 분씩 걸려 브라우저만 내려받는다.
      - run: npx playwright install chromium

      - run: npm test

      - run: npm run build:electron
