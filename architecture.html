<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smartstore-price-bot 아키텍처</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f4f8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 48px;
        color: #1a202c;
      }

      h1 {
        font-size: 18px;
        font-weight: 700;
        color: #2d3748;
        margin-bottom: 56px;
      }

      /*
        레이아웃:
        [Google Sheets] ←→ [app.js] ←→ [Naver Commerce API]
                                ↕
                          [Puppeteer]
      */
      .diagram {
        display: grid;
        grid-template-columns: 200px 160px 200px 160px 200px;
        grid-template-rows: auto 100px auto;
        align-items: center;
        justify-items: center;
      }

      /* ── 박스 ── */
      .box {
        border-radius: 12px;
        padding: 20px 24px;
        border: 2px solid;
        text-align: center;
        width: 200px;
      }

      .box-name {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.4;
      }

      .box-sub {
        font-size: 11px;
        margin-top: 6px;
        opacity: 0.65;
        line-height: 1.6;
      }

      .box-sheets {
        border-color: #38a169;
        background: #f0fff4;
        border-style: dashed;
      }
      .box-sheets .box-name { color: #276749; }

      .box-center {
        border-color: #667eea;
        background: #ebf4ff;
      }
      .box-center .box-name { color: #434190; }

      .box-naver {
        border-color: #3182ce;
        background: #ebf8ff;
        border-style: dashed;
      }
      .box-naver .box-name { color: #2c5282; }

      .box-puppeteer {
        border-color: #d69e2e;
        background: #fffff0;
        grid-column: 3;
        grid-row: 3;
      }
      .box-puppeteer .box-name { color: #7b341e; }

      /* ── 수평 화살표 ── */
      .h-arrow {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 0 20px;
      }

      .h-arrow-row {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 4px;
      }

      .h-line {
        flex: 1;
        height: 2px;
        background: #a0aec0;
        position: relative;
      }

      .h-line.arrow-right::after {
        content: "▶";
        position: absolute;
        right: -8px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 10px;
        color: #a0aec0;
      }

      .h-line.arrow-left::before {
        content: "◀";
        position: absolute;
        left: -8px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 10px;
        color: #a0aec0;
      }

      .h-label {
        font-size: 10.5px;
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
        color: #718096;
      }

      /* ── 수직 화살표 ── */
      .v-arrow {
        grid-column: 3;
        grid-row: 2;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        justify-content: center;
        gap: 16px;
        height: 100%;
        padding: 20px 0;
      }

      .v-arrow-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        height: 100%;
      }

      .v-line {
        flex: 1;
        width: 2px;
        background: #a0aec0;
        position: relative;
      }

      .v-line.arrow-down::after {
        content: "▼";
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        color: #a0aec0;
      }

      .v-line.arrow-up::before {
        content: "▲";
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        color: #a0aec0;
      }

      .v-label {
        font-size: 10.5px;
        font-weight: 600;
        text-align: center;
        color: #718096;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1>🤖 smartstore-price-bot 아키텍처</h1>

    <div class="diagram">

      <!-- Row 1 -->
      <div class="box box-sheets">
        <div class="box-name">📊 Google Sheets API</div>
        <div class="box-sub">제품 카탈로그</div>
      </div>

      <!-- Sheets ↔ app.js 수평 화살표 -->
      <div class="h-arrow">
        <div class="h-arrow-row">
          <div class="h-line arrow-right"></div>
        </div>
        <div class="h-label">활성 제품 행</div>
        <div class="h-arrow-row" style="margin-top: 2px;">
          <div class="h-line arrow-left"></div>
        </div>
        <div class="h-label" style="visibility:hidden;">-</div>
      </div>

      <div class="box box-center">
        <div class="box-name">⚙️ app.js</div>
        <div class="box-sub">오케스트레이터<br/>가격 비교 / 업데이트 결정</div>
      </div>

      <!-- app.js ↔ Naver 수평 화살표 -->
      <div class="h-arrow">
        <div class="h-arrow-row">
          <div class="h-line arrow-right"></div>
        </div>
        <div class="h-label">가격 업데이트 요청</div>
        <div class="h-arrow-row" style="margin-top: 2px;">
          <div class="h-line arrow-left"></div>
        </div>
        <div class="h-label">판매 상품 목록</div>
      </div>

      <div class="box box-naver">
        <div class="box-name">🛍️ 네이버 커머스 API</div>
        <div class="box-sub">판매 상품 조회<br/>가격 업데이트</div>
      </div>

      <!-- Row 2: 수직 화살표 -->
      <div></div>
      <div></div>
      <div class="v-arrow">
        <div class="v-arrow-col">
          <div class="v-label">카탈로그 URL</div>
          <div class="v-line arrow-down"></div>
        </div>
        <div class="v-arrow-col">
          <div class="v-line arrow-up"></div>
          <div class="v-label">판매처별 가격</div>
        </div>
      </div>
      <div></div>
      <div></div>

      <!-- Row 3: Puppeteer -->
      <div class="box box-puppeteer">
        <div class="box-name">🖥️ Puppeteer</div>
        <div class="box-sub">네이버 쇼핑 크롤링<br/>(Chrome 자동화)</div>
      </div>

    </div>
  </body>
</html>
